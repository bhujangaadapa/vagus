<div class="min-h-screen bg-[#06070a] text-slate-100 flex flex-col font-sans selection:bg-[#00F5A0] selection:text-black">

  <!-- STATE A: ATHLETE NOT LOGGED IN -> WHOOP LOGIN & ONBOARDING GATE -->
  <div *ngIf="!authService.currentUser()">
    <app-login></app-login>
  </div>

  <!-- STATE B: ATHLETE AUTHENTICATED -> FULL DASHBOARD & DEV LAB -->
  <div *ngIf="authService.currentUser()" class="flex-1 flex flex-col">
    <!-- Top Global System Navigation Bar -->
    <header class="h-14 bg-[#06070a]/90 border-b border-white/[0.06] sticky top-0 z-50 backdrop-blur-xl px-4 sm:px-6 flex items-center justify-between">
      <!-- Brand / System Title -->
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#00F5A0] via-cyan-500 to-indigo-600 p-[1.5px] flex items-center justify-center shadow-lg shadow-emerald-950/40">
          <div class="w-full h-full bg-[#06070a] rounded-[10px] flex items-center justify-center font-mono font-black text-[#00F5A0] text-sm tracking-tighter">
            V
          </div>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="font-mono font-extrabold tracking-wider text-base text-white">VAGUS</span>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded-full bg-white/[0.05] border border-white/[0.08] text-zinc-400">
            WHOOP 4.0
          </span>
        </div>
      </div>

      <!-- View Switcher -->
      <nav class="flex items-center gap-1.5 p-1 rounded-2xl bg-white/[0.04] border border-white/[0.06] font-mono text-xs">
        <button
          type="button"
          (click)="setView('dashboard')"
          class="px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-semibold cursor-pointer"
          [ngClass]="activeView() === 'dashboard' ? 'bg-[#00F5A0] text-black shadow-md font-bold' : 'text-zinc-400 hover:text-white'"
        >
          <span>⚡ DASHBOARD</span>
        </button>

        <button
          type="button"
          (click)="setView('developer-lab')"
          class="px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-semibold cursor-pointer"
          [ngClass]="activeView() === 'developer-lab' ? 'bg-indigo-600 text-white shadow-md font-bold' : 'text-zinc-400 hover:text-white'"
        >
          <span>🔬 DEV LAB</span>
        </button>
      </nav>
    </header>

    <!-- View Content -->
    <main class="flex-1">
      <app-dashboard *ngIf="activeView() === 'dashboard'"></app-dashboard>
      <app-developer-lab *ngIf="activeView() === 'developer-lab'"></app-developer-lab>
    </main>
  </div>

</div>
